services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: artisancode-webui:latest
    container_name: artisancode-webui
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      PORT: 3000
      NITRO_PORT: 3000
      NUXT_API_BASE: ${NUXT_API_BASE:-}
